<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录页重做原型 · 千树 DMS</title>
<style>
  :root {
    color-scheme: light;

    /* 与 web/packages/themes（zinc + green）保持一致，仅用于原型预览。 */
    --background: 1 0 0;
    --foreground: 0.141 0.005 285.823;
    --card: 1 0 0;
    --card-foreground: 0.141 0.005 285.823;
    --muted: 0.967 0.001 286.375;
    --muted-foreground: 0.552 0.016 285.938;
    --border: 0.92 0.004 286.32;
    --input: 0.92 0.004 286.32;
    --ring: 0.705 0.015 286.067;
    --primary: 0.527 0.154 150.069;
    --primary-foreground: 0.982 0.018 155.826;
    --destructive: 0.577 0.245 27.325;

    --radius-card: 12px;
    --radius-control: 6px;
    --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Noto Sans Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  html.dark {
    color-scheme: dark;
    --background: 0.141 0.005 285.823;
    --foreground: 0.985 0 0;
    --card: 0.21 0.006 285.885;
    --card-foreground: 0.985 0 0;
    --muted: 0.274 0.006 286.033;
    --muted-foreground: 0.705 0.015 286.067;
    --border: 0.252 0 0;
    --input: 0.341 0 0;
    --ring: 0.552 0.016 285.938;
    --primary: 0.448 0.119 151.328;
    --primary-foreground: 0.982 0.018 155.826;
    --destructive: 0.704 0.191 22.216;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    margin: 0;
    background: oklch(var(--background));
    color: oklch(var(--foreground));
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  input {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
  }

  :focus-visible {
    outline: 2px solid oklch(var(--ring));
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ------------------------------------------------------------------ 原型控制条
     这一条不属于登录页设计本身，仅用于切换预览状态。 */
  .proto-bar {
    position: relative;
    z-index: 20;
    display: flex;
    flex: none;
    align-items: center;
    gap: 18px;
    min-height: 54px;
    padding: 8px 16px;
    overflow-x: auto;
    background: oklch(0.141 0.005 285.823);
    color: oklch(0.985 0 0);
    box-shadow: 0 1px 0 rgb(255 255 255 / 8%);
  }

  .proto-bar__title {
    display: flex;
    flex: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .proto-bar__title::before {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: oklch(0.723 0.219 149.579);
    content: "";
  }

  .proto-bar__groups {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 18px;
  }

  .proto-group {
    display: flex;
    flex: none;
    align-items: center;
    gap: 4px;
    padding-left: 14px;
    border-left: 1px solid rgb(255 255 255 / 14%);
  }

  .proto-group:first-child {
    padding-left: 0;
    border-left: 0;
  }

  .proto-group__label {
    margin-right: 4px;
    color: rgb(255 255 255 / 45%);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .proto-chip {
    height: 26px;
    padding: 0 9px;
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: 6px;
    background: transparent;
    color: rgb(255 255 255 / 72%);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .proto-chip:hover {
    border-color: rgb(255 255 255 / 32%);
    background: rgb(255 255 255 / 6%);
    color: #fff;
  }

  .proto-chip[aria-pressed="true"] {
    border-color: oklch(0.723 0.219 149.579);
    background: oklch(0.527 0.154 150.069);
    color: oklch(0.982 0.018 155.826);
  }

  .proto-bar__collapse {
    flex: none;
    height: 26px;
    margin-left: auto;
    padding: 0 9px;
    border: 1px solid rgb(255 255 255 / 14%);
    border-radius: 6px;
    background: transparent;
    color: rgb(255 255 255 / 55%);
    font-size: 11px;
    white-space: nowrap;
  }

  .proto-bar__collapse:hover {
    color: #fff;
    border-color: rgb(255 255 255 / 30%);
  }

  .proto-bar.is-collapsed .proto-bar__groups {
    display: none;
  }

  .proto-bar__note {
    flex: none;
    color: rgb(255 255 255 / 30%);
    font-size: 10px;
    white-space: nowrap;
  }

  .proto-bar.is-collapsed .proto-bar__note {
    display: none;
  }

  /* ------------------------------------------------------------------ 预览舞台 */
  .stage {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: oklch(var(--background));
  }

  .stage.is-device {
    display: grid;
    place-items: center;
    padding: 22px;
    background:
      radial-gradient(circle at 50% 0%, rgb(255 255 255 / 6%), transparent 55%),
      oklch(0.12 0.005 285.823);
  }

  .stage__frame {
    width: 100%;
    min-width: 0;
    min-height: 100%;
    container-name: login;
    container-type: inline-size;
  }

  .stage.is-device .stage__frame {
    width: 390px;
    height: 780px;
    min-height: 0;
    overflow: auto;
    border: 1px solid rgb(255 255 255 / 12%);
    border-radius: 28px;
    background: oklch(var(--background));
    box-shadow: 0 28px 80px rgb(0 0 0 / 45%);
  }

  .login-shell {
    display: grid;
    grid-template-columns: clamp(380px, 40%, 560px) minmax(0, 1fr);
    min-height: 100%;
    background: oklch(var(--background));
  }

  /* ------------------------------------------------------------------ 品牌栏 */
  .brand-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 40px 40px 20px;
    overflow: hidden;
    background:
      radial-gradient(circle at 88% 82%, oklch(var(--primary-foreground) / 10%), transparent 38%),
      linear-gradient(155deg, color-mix(in oklch, oklch(var(--primary)), black 20%) 0%, oklch(var(--primary)) 52%, color-mix(in oklch, oklch(var(--primary)), white 9%) 100%);
    color: oklch(var(--primary-foreground));
    isolation: isolate;
  }

  /* 平滑点阵只出现在右下区域，替代原先放大后边缘粗糙的 Logo 水印。 */
  .brand-panel::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(oklch(var(--primary-foreground) / 18%) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.45;
    content: "";
    pointer-events: none;
    mask-image: radial-gradient(ellipse at 80% 82%, black 0%, transparent 62%);
    -webkit-mask-image: radial-gradient(ellipse at 80% 82%, black 0%, transparent 62%);
  }

  /* 大尺寸同心圆环提供几何层次，边缘完全由 CSS 绘制，不存在矢量化锯齿。 */
  .brand-panel::after {
    position: absolute;
    right: -260px;
    bottom: -300px;
    z-index: 0;
    width: 680px;
    height: 680px;
    border: 1px solid oklch(var(--primary-foreground) / 12%);
    border-radius: 50%;
    box-shadow:
      0 0 0 72px oklch(var(--primary-foreground) / 4%),
      0 0 0 164px oklch(var(--primary-foreground) / 2%);
    content: "";
    pointer-events: none;
  }

  .brand-lockup {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-tile {
    display: grid;
    flex: none;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 6px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 0 rgb(0 0 0 / 12%), 0 8px 20px rgb(0 0 0 / 10%);
  }

  .logo-tile img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .brand-name {
    margin: 0;
    color: inherit;
    font-size: 22px;
    font-weight: 600;
    line-height: 30px;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .brand-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
  }

  .brand-submark {
    color: oklch(var(--primary-foreground) / 62%);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    line-height: 16px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .brand-center {
    position: relative;
    z-index: 2;
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    justify-content: center;
    max-width: 380px;
    padding: 48px 0 160px;
  }

  .brand-rule {
    width: 40px;
    height: 2px;
    margin-bottom: 20px;
    border-radius: 999px;
    background: oklch(var(--primary-foreground) / 42%);
  }

  .brand-slogan {
    margin: 0;
    color: oklch(var(--primary-foreground));
    font-size: 28px;
    font-weight: 600;
    line-height: 38px;
    letter-spacing: 0;
  }

  .brand-capabilities {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 0;
    margin: 20px 0 0;
    color: oklch(var(--primary-foreground) / 72%);
    font-size: 15px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0.02em;
  }

  .brand-capabilities span {
    display: inline-flex;
    align-items: center;
  }

  .brand-capabilities span + span::before {
    margin: 0 10px;
    color: oklch(var(--primary-foreground) / 32%);
    content: "·";
  }

  .brand-foot {
    position: relative;
    z-index: 2;
    margin-top: 0;
  }

  .brand-note {
    margin: 0;
    color: oklch(var(--primary-foreground) / 70%);
    font-size: 12px;
    line-height: 18px;
  }

  /* ------------------------------------------------------------------ 表单区 */
  .form-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 56px clamp(24px, 3vw, 48px) 76px;
    background: oklch(var(--muted) / 42%);
  }

  .center-brand {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .center-brand__lockup {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .center-brand .logo-tile {
    width: 44px;
    height: 44px;
    border: 1px solid oklch(var(--border));
    box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
  }

  .center-brand .brand-name {
    color: oklch(var(--foreground));
    font-size: 16px;
    line-height: 24px;
  }

  .center-brand__sub {
    margin: 0;
    color: oklch(var(--muted-foreground));
    font-size: 12px;
    line-height: 18px;
  }

  .form-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    padding: 52px 48px;
    border: 1px solid oklch(var(--border));
    border-radius: var(--radius-card);
    background: oklch(var(--card));
    box-shadow:
      0 1px 2px oklch(var(--foreground) / 4%),
      0 18px 44px oklch(var(--foreground) / 5%);
  }

  .form-head h1 {
    margin: 0;
    color: oklch(var(--card-foreground));
    font-size: 24px;
    font-weight: 600;
    line-height: 32px;
    letter-spacing: 0;
  }

  .form-head p {
    margin: 8px 0 28px;
    color: oklch(var(--muted-foreground));
    font-size: 14px;
    line-height: 20px;
  }

  .field + .field {
    margin-top: 12px;
  }

  .field label {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
    padding: 0 1px;
    color: oklch(var(--foreground));
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
  }

  .required-mark {
    color: oklch(var(--destructive));
    font-weight: 500;
  }

  .input-shell {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 12px;
    border: 1px solid oklch(var(--input));
    border-radius: var(--radius-control);
    background: oklch(var(--background));
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }

  .input-shell:hover {
    border-color: oklch(var(--ring) / 70%);
  }

  .input-shell:focus-within {
    border-color: oklch(var(--ring));
    box-shadow: 0 0 0 3px oklch(var(--ring) / 18%);
  }

  .input-shell.is-invalid {
    border-color: oklch(var(--destructive));
  }

  .input-shell.is-invalid:focus-within {
    box-shadow: 0 0 0 3px oklch(var(--destructive) / 14%);
  }

  .input-shell.is-disabled {
    background: oklch(var(--muted) / 50%);
    opacity: 0.65;
  }

  .input-icon {
    flex: none;
    width: 16px;
    height: 16px;
    color: oklch(var(--muted-foreground));
  }

  .input-shell input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: oklch(var(--foreground));
    font-size: 14px;
    line-height: 20px;
  }

  .input-shell input::placeholder {
    color: oklch(var(--muted-foreground) / 78%);
  }

  .input-shell input:-webkit-autofill {
    -webkit-text-fill-color: oklch(var(--foreground));
    box-shadow: 0 0 0 1000px oklch(var(--background)) inset;
  }

  .eye-button {
    display: inline-grid;
    flex: none;
    place-items: center;
    width: 32px;
    height: 32px;
    margin-right: -8px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: oklch(var(--muted-foreground));
    transition: background 120ms ease, color 120ms ease;
  }

  .eye-button:hover {
    background: oklch(var(--muted) / 70%);
    color: oklch(var(--foreground));
  }

  .eye-button svg {
    width: 17px;
    height: 17px;
  }

  .field-error {
    min-height: 18px;
    margin: 0;
    padding: 2px 4px 0;
    color: oklch(var(--destructive));
    font-size: 12px;
    line-height: 16px;
  }

  .alert {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    gap: 9px;
    margin: 0 0 16px;
    padding: 10px 12px;
    border: 1px solid oklch(var(--destructive) / 30%);
    border-radius: 8px;
    background: oklch(var(--destructive) / 7%);
    color: oklch(var(--foreground));
    font-size: 13px;
    line-height: 18px;
  }

  .alert__icon {
    width: 16px;
    height: 16px;
    margin-top: 1px;
    color: oklch(var(--destructive));
  }

  .alert__message {
    margin: 0;
  }

  .alert__action {
    margin-top: 5px;
    padding: 0;
    border: 0;
    background: transparent;
    color: oklch(var(--destructive));
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .alert__action:hover {
    text-decoration-thickness: 2px;
  }

  .alert__action:disabled {
    opacity: 0.55;
  }

  .success-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    padding: 10px 12px;
    border: 1px solid oklch(var(--primary) / 26%);
    border-radius: 8px;
    background: oklch(var(--primary) / 8%);
    color: oklch(var(--foreground));
    font-size: 13px;
    line-height: 18px;
  }

  .success-note svg {
    flex: none;
    width: 16px;
    height: 16px;
    color: oklch(var(--primary));
  }

  .submit-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 44px;
    margin-top: 4px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--radius-control);
    background: oklch(var(--primary));
    color: oklch(var(--primary-foreground));
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    box-shadow: 0 1px 1px rgb(0 0 0 / 5%);
    transition: background 150ms ease, opacity 150ms ease, transform 80ms ease;
  }

  .submit-button:hover:not(:disabled) {
    background: color-mix(in oklch, oklch(var(--primary)), black 10%);
    box-shadow: 0 2px 6px oklch(var(--primary) / 18%);
  }

  .submit-button:active:not(:disabled) {
    background: color-mix(in oklch, oklch(var(--primary)), black 16%);
    box-shadow: 0 1px 2px oklch(var(--primary) / 20%);
    transform: translateY(1px);
  }

  .submit-button:disabled {
    opacity: 0.62;
  }

  .submit-button:focus-visible {
    outline: 2px solid oklch(var(--primary));
    outline-offset: 2px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid currentcolor;
    border-right-color: transparent;
    border-radius: 999px;
    opacity: 0.8;
    animation: spin 720ms linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .login-footer {
    position: absolute;
    right: 0;
    bottom: 20px;
    left: 0;
    padding: 0 32px;
    color: oklch(var(--muted-foreground) / 78%);
    font-size: 12px;
    line-height: 18px;
    text-align: center;
  }

  /* ------------------------------------------------------------------ 居中卡片方案 */
  .login-shell[data-layout="center"] {
    grid-template-columns: minmax(0, 1fr);
    background: oklch(var(--muted) / 38%);
  }

  .login-shell[data-layout="center"] .brand-panel {
    display: none;
  }

  .login-shell[data-layout="center"] .form-panel {
    background: transparent;
  }

  .login-shell[data-layout="center"] .center-brand {
    display: flex;
  }

  .login-shell[data-layout="center"] .login-footer {
    padding: 0 32px;
  }

  /* ------------------------------------------------------------------ 窄屏 */
  @container login (max-width: 1023px) {
    .login-shell {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
    }

    .brand-panel {
      flex-direction: row;
      align-items: flex-start;
      min-height: 0;
      padding: 20px 20px 34px;
    }

    .brand-panel::before {
      opacity: 0.32;
      mask-image: radial-gradient(ellipse at 88% 70%, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 88% 70%, black 0%, transparent 70%);
    }

    .brand-panel::after {
      display: none;
    }

    .brand-panel .logo-tile {
      width: 42px;
      height: 42px;
      padding: 5px;
    }

    .brand-panel .brand-name {
      font-size: 16px;
      line-height: 24px;
    }

    .brand-submark {
      display: none;
    }

    .brand-center {
      display: none;
    }

    .brand-foot {
      position: absolute;
      bottom: 10px;
      left: 20px;
      display: block;
    }

    .brand-note {
      font-size: 11px;
      line-height: 16px;
    }

    .form-panel {
      justify-content: flex-start;
      padding: 24px 20px 32px;
      background: oklch(var(--background));
    }

    .form-card {
      max-width: 440px;
      padding: 8px 4px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .form-head p {
      margin-bottom: 24px;
    }

    .login-footer {
      position: static;
      margin-top: 28px;
      padding: 0;
    }

    .login-shell[data-layout="center"] {
      background: oklch(var(--background));
    }

    .login-shell[data-layout="center"] .center-brand {
      margin-bottom: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="proto-bar" id="protoBar">
    <div class="proto-bar__title">登录页重做 · 原型</div>
    <div class="proto-bar__groups">
      <div class="proto-group" role="group" aria-label="布局">
        <span class="proto-group__label">布局</span>
        <button class="proto-chip" type="button" data-layout="split" aria-pressed="true">分栏</button>
        <button class="proto-chip" type="button" data-layout="center" aria-pressed="false">居中</button>
      </div>
      <div class="proto-group" role="group" aria-label="主题">
        <span class="proto-group__label">主题</span>
        <button class="proto-chip" type="button" data-theme="light" aria-pressed="true">亮色</button>
        <button class="proto-chip" type="button" data-theme="dark" aria-pressed="false">暗色</button>
      </div>
      <div class="proto-group" role="group" aria-label="交互状态">
        <span class="proto-group__label">状态</span>
        <button class="proto-chip" type="button" data-demo="normal" aria-pressed="true">正常</button>
        <button class="proto-chip" type="button" data-demo="invalid" aria-pressed="false">校验</button>
        <button class="proto-chip" type="button" data-demo="credential" aria-pressed="false">凭证错误</button>
        <button class="proto-chip" type="button" data-demo="unavailable" aria-pressed="false">服务不可用</button>
        <button class="proto-chip" type="button" data-demo="loading" aria-pressed="false">提交中</button>
      </div>
      <div class="proto-group" role="group" aria-label="预览视口">
        <span class="proto-group__label">视口</span>
        <button class="proto-chip" type="button" data-viewport="desktop" aria-pressed="true">桌面</button>
        <button class="proto-chip" type="button" data-viewport="device" aria-pressed="false">390</button>
      </div>
      <span class="proto-bar__note">原型控制不属于页面设计</span>
    </div>
    <button class="proto-bar__collapse" type="button" id="collapseProtoBar">收起</button>
  </div>

  <div class="stage" id="stage">
    <div class="stage__frame">
      <div class="login-shell" id="loginShell" data-layout="split">
        <aside class="brand-panel" aria-label="品牌信息">
          <div class="brand-lockup">
            <div class="logo-tile">
              <img src="../../web/apps/qsmds-arco/src/assets/images/logo.svg" alt="千树数据管理系统 Logo">
            </div>
            <div>
              <p class="brand-name">千树数据管理系统</p>
              <div class="brand-meta">
                <span class="brand-submark">Qianshu DMS</span>
              </div>
            </div>
          </div>

          <div class="brand-center">
            <span class="brand-rule" aria-hidden="true"></span>
            <p class="brand-slogan">产品流转与资金同频<br>业务协同与财务一体</p>
            <p class="brand-capabilities"><span>销售</span><span>采购</span><span>仓储</span><span>财务</span></p>
          </div>

          <div class="brand-foot">
            <p class="brand-note">内部业务数据工作台 · v0.8.4版</p>
          </div>
        </aside>

        <main class="form-panel">
          <div class="center-brand" aria-label="千树数据管理系统">
            <div class="center-brand__lockup">
              <div class="logo-tile">
                <img src="../../web/apps/qsmds-arco/src/assets/images/logo.svg" alt="">
              </div>
              <div>
                <p class="brand-name">千树数据管理系统</p>
              </div>
            </div>
            <p class="center-brand__sub">内部业务数据工作台 · v0.8.4版</p>
          </div>

          <section class="form-card" aria-labelledby="loginTitle">
            <header class="form-head">
              <h1 id="loginTitle">欢迎登录</h1>
              <p>使用管理员分配的账号进入工作台</p>
            </header>

            <div class="alert" id="globalAlert" role="alert" hidden>
              <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
              </svg>
              <div>
                <p class="alert__message" id="globalAlertMessage"></p>
                <button class="alert__action" type="button" id="checkLoginState" hidden>检查登录状态</button>
              </div>
            </div>

            <form id="loginForm" novalidate aria-busy="false">
              <div class="field" id="usernameField">
                <label for="username">账号 <span class="required-mark" aria-hidden="true">*</span></label>
                <div class="input-shell" id="usernameShell">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="请输入账号"
                    autocomplete="username"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="next"
                    required
                    aria-required="true"
                    aria-describedby="usernameError"
                  >
                </div>
                <p class="field-error" id="usernameError" aria-live="polite"></p>
              </div>

              <div class="field" id="passwordField">
                <label for="password">密码 <span class="required-mark" aria-hidden="true">*</span></label>
                <div class="input-shell" id="passwordShell">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="请输入登录密码"
                    maxlength="20"
                    autocomplete="current-password"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="go"
                    required
                    aria-required="true"
                    aria-describedby="passwordError"
                  >
                  <button class="eye-button" type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false" title="显示密码">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <p class="field-error" id="passwordError" aria-live="polite"></p>
              </div>

              <div class="success-note" id="successNote" role="status" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                <span>登录成功，正在进入工作台…</span>
              </div>

              <button class="submit-button" type="submit" id="submitButton">
                <span class="spinner" id="submitSpinner" hidden aria-hidden="true"></span>
                <span id="submitLabel">登录系统</span>
              </button>
            </form>
          </section>

          <footer class="login-footer">
            Copyright © 2023–2026 Liaocheng Qianshu Culture Media Co., Ltd. All Rights Reserved.
          </footer>
        </main>
      </div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const protoBar = document.getElementById('protoBar');
  const stage = document.getElementById('stage');
  const loginShell = document.getElementById('loginShell');
  const form = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const usernameField = document.getElementById('usernameField');
  const passwordField = document.getElementById('passwordField');
  const usernameShell = document.getElementById('usernameShell');
  const passwordShell = document.getElementById('passwordShell');
  const usernameError = document.getElementById('usernameError');
  const passwordError = document.getElementById('passwordError');
  const globalAlert = document.getElementById('globalAlert');
  const globalAlertMessage = document.getElementById('globalAlertMessage');
  const checkLoginState = document.getElementById('checkLoginState');
  const successNote = document.getElementById('successNote');
  const submitButton = document.getElementById('submitButton');
  const submitSpinner = document.getElementById('submitSpinner');
  const submitLabel = document.getElementById('submitLabel');
  const togglePassword = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  const state = {
    demo: 'normal',
    layout: 'split',
    loading: false,
    theme: 'light',
    touched: {
      password: false,
      username: false,
    },
    viewport: 'desktop',
  };

  const icons = {
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle>',
    eyeOff: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path>',
  };

  function setPressed(groupSelector, attribute, activeValue) {
    document.querySelectorAll(`${groupSelector} [${attribute}]`).forEach((button) => {
      button.setAttribute('aria-pressed', String(button.getAttribute(attribute) === activeValue));
    });
  }

  function render() {
    root.classList.toggle('dark', state.theme === 'dark');
    loginShell.dataset.layout = state.layout;
    stage.classList.toggle('is-device', state.viewport === 'device');
    setPressed('.proto-group', 'data-layout', state.layout);
    setPressed('.proto-group', 'data-theme', state.theme);
    setPressed('.proto-group', 'data-demo', state.demo);
    setPressed('.proto-group', 'data-viewport', state.viewport);
  }

  function setLoading(loading) {
    state.loading = loading;
    submitButton.disabled = loading;
    usernameInput.disabled = loading;
    passwordInput.disabled = loading;
    togglePassword.disabled = loading;
    usernameShell.classList.toggle('is-disabled', loading);
    passwordShell.classList.toggle('is-disabled', loading);
    submitSpinner.hidden = !loading;
    submitLabel.textContent = loading ? '登录中…' : '登录系统';
    form.setAttribute('aria-busy', String(loading));
  }

  function clearFieldError(name) {
    const field = name === 'username' ? usernameField : passwordField;
    const shell = name === 'username' ? usernameShell : passwordShell;
    const error = name === 'username' ? usernameError : passwordError;
    const input = name === 'username' ? usernameInput : passwordInput;
    field.classList.remove('has-error');
    shell.classList.remove('is-invalid');
    input.removeAttribute('aria-invalid');
    error.textContent = '';
  }

  function setFieldError(name, message) {
    const field = name === 'username' ? usernameField : passwordField;
    const shell = name === 'username' ? usernameShell : passwordShell;
    const error = name === 'username' ? usernameError : passwordError;
    const input = name === 'username' ? usernameInput : passwordInput;
    field.classList.toggle('has-error', Boolean(message));
    shell.classList.toggle('is-invalid', Boolean(message));
    input.setAttribute('aria-invalid', String(Boolean(message)));
    error.textContent = message;
  }

  function validateField(name) {
    const input = name === 'username' ? usernameInput : passwordInput;
    const value = input.value;
    let message = '';

    if (name === 'username') {
      if (value.length === 0) {
        message = '请输入账号';
      }
    }
    else if (value.length === 0) {
      message = '请输入密码';
    }

    setFieldError(name, message);
    return message === '';
  }

  function validateAll() {
    state.touched.username = true;
    state.touched.password = true;
    const usernameValid = validateField('username');
    const passwordValid = validateField('password');

    if (!usernameValid) {
      usernameInput.focus();
      return false;
    }
    if (!passwordValid) {
      passwordInput.focus();
      return false;
    }
    return true;
  }

  function clearAlert() {
    globalAlert.hidden = true;
    globalAlertMessage.textContent = '';
    checkLoginState.hidden = true;
  }

  function showAlert(message, withCheckAction) {
    globalAlertMessage.textContent = message;
    checkLoginState.hidden = !withCheckAction;
    checkLoginState.disabled = false;
    checkLoginState.textContent = '检查登录状态';
    globalAlert.hidden = false;
  }

  function clearSuccess() {
    successNote.hidden = true;
  }

  function syncPasswordToggle() {
    const visible = passwordInput.type === 'text';
    togglePassword.setAttribute('aria-pressed', String(visible));
    togglePassword.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
    togglePassword.title = visible ? '隐藏密码' : '显示密码';
    eyeIcon.innerHTML = visible ? icons.eyeOff : icons.eye;
  }

  function resetToNormal() {
    clearAlert();
    clearSuccess();
    clearFieldError('username');
    clearFieldError('password');
    setLoading(false);
    usernameInput.value = '';
    passwordInput.value = '';
    passwordInput.type = 'password';
    state.touched.username = false;
    state.touched.password = false;
    syncPasswordToggle();
  }

  function applyDemo(demo) {
    state.demo = demo;
    clearAlert();
    clearSuccess();
    clearFieldError('username');
    clearFieldError('password');
    setLoading(false);
    state.touched.username = false;
    state.touched.password = false;
    passwordInput.type = 'password';
    syncPasswordToggle();

    if (demo === 'normal') {
      usernameInput.value = '';
      passwordInput.value = '';
      syncPasswordToggle();
    }
    else if (demo === 'invalid') {
      usernameInput.value = '';
      passwordInput.value = '';
      syncPasswordToggle();
      state.touched.username = true;
      state.touched.password = true;
      validateField('username');
      validateField('password');
    }
    else if (demo === 'credential') {
      usernameInput.value = 'operator';
      passwordInput.value = '';
      syncPasswordToggle();
      showAlert('账号或密码错误', false);
      passwordInput.focus();
    }
    else if (demo === 'unavailable') {
      usernameInput.value = 'operator';
      passwordInput.value = '';
      syncPasswordToggle();
      showAlert('认证服务暂时不可用', true);
    }
    else if (demo === 'loading') {
      usernameInput.value = 'operator';
      passwordInput.value = 'Qianshu2026';
      syncPasswordToggle();
      setLoading(true);
    }

    render();
  }

  document.querySelectorAll('[data-layout]').forEach((button) => {
    button.addEventListener('click', () => {
      state.layout = button.dataset.layout;
      render();
    });
  });

  document.querySelectorAll('[data-theme]').forEach((button) => {
    button.addEventListener('click', () => {
      state.theme = button.dataset.theme;
      render();
    });
  });

  document.querySelectorAll('[data-viewport]').forEach((button) => {
    button.addEventListener('click', () => {
      state.viewport = button.dataset.viewport;
      render();
    });
  });

  document.querySelectorAll('[data-demo]').forEach((button) => {
    button.addEventListener('click', () => {
      applyDemo(button.dataset.demo);
    });
  });

  document.getElementById('collapseProtoBar').addEventListener('click', (event) => {
    const collapsed = protoBar.classList.toggle('is-collapsed');
    event.currentTarget.textContent = collapsed ? '展开' : '收起';
  });

  usernameInput.addEventListener('blur', () => {
    state.touched.username = true;
    validateField('username');
  });

  passwordInput.addEventListener('blur', () => {
    state.touched.password = true;
    validateField('password');
  });

  usernameInput.addEventListener('input', () => {
    clearAlert();
    clearSuccess();
    if (state.touched.username || usernameError.textContent) {
      validateField('username');
    }
  });

  passwordInput.addEventListener('input', () => {
    clearAlert();
    clearSuccess();
    if (passwordInput.value.length === 0 && passwordInput.type === 'text') {
      passwordInput.type = 'password';
    }
    syncPasswordToggle();
    if (state.touched.password || passwordError.textContent) {
      validateField('password');
    }
  });

  togglePassword.addEventListener('click', () => {
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    syncPasswordToggle();
    passwordInput.focus();
  });

  checkLoginState.addEventListener('click', () => {
    if (checkLoginState.disabled) {
      return;
    }
    checkLoginState.disabled = true;
    checkLoginState.textContent = '检查中…';
    window.setTimeout(() => {
      checkLoginState.disabled = false;
      checkLoginState.textContent = '检查登录状态';
      showAlert('当前仍未登录，可稍后再次检查或重新输入密码登录', true);
    }, 800);
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (state.loading) {
      return;
    }
    clearAlert();
    clearSuccess();

    if (!validateAll()) {
      return;
    }

    setLoading(true);
    const demo = state.demo;

    window.setTimeout(() => {
      setLoading(false);

      if (demo === 'credential') {
        passwordInput.value = '';
        passwordInput.type = 'password';
        syncPasswordToggle();
        showAlert('账号或密码错误', false);
        passwordInput.focus();
        return;
      }

      if (demo === 'unavailable') {
        passwordInput.value = '';
        passwordInput.type = 'password';
        syncPasswordToggle();
        showAlert('认证服务暂时不可用', true);
        return;
      }

      successNote.hidden = false;
      submitButton.disabled = true;
      window.setTimeout(() => {
        successNote.hidden = true;
        submitButton.disabled = false;
      }, 1800);
    }, 900);
  });

  syncPasswordToggle();
  render();
</script>
</body>
</html>
