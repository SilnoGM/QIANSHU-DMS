<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录页重做原型 · 居中档案版</title>
<style>
  :root {
    color-scheme: light;
    --background: 1 0 0;
    --foreground: 0.141 0.005 285.823;
    --card: 1 0 0;
    --muted: 0.967 0.001 286.375;
    --muted-foreground: 0.552 0.016 285.938;
    --border: 0.92 0.004 286.32;
    --input: 0.92 0.004 286.32;
    --ring: 0.705 0.015 286.067;
    --primary: 0.527 0.154 150.069;
    --primary-foreground: 0.982 0.018 155.826;
    --destructive: 0.577 0.245 27.325;
    --radius-control: 6px;
    --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Noto Sans Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  html.dark {
    color-scheme: dark;
    --background: 0.141 0.005 285.823;
    --foreground: 0.985 0 0;
    --card: 0.21 0.006 285.885;
    --muted: 0.274 0.006 286.033;
    --muted-foreground: 0.705 0.015 286.067;
    --border: 0.252 0 0;
    --input: 0.341 0 0;
    --ring: 0.552 0.016 285.938;
    --primary: 0.448 0.119 151.328;
    --primary-foreground: 0.982 0.018 155.826;
    --destructive: 0.704 0.191 22.216;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    margin: 0;
    background: oklch(var(--background));
    color: oklch(var(--foreground));
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  input {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
  }

  :focus-visible {
    outline: 2px solid oklch(var(--ring));
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ------------------------------------------------------------------ 原型控制条 */
  .proto-bar {
    position: relative;
    z-index: 20;
    display: flex;
    flex: none;
    align-items: center;
    gap: 18px;
    min-height: 54px;
    padding: 8px 16px;
    overflow-x: auto;
    background: oklch(0.141 0.005 285.823);
    color: oklch(0.985 0 0);
    box-shadow: 0 1px 0 rgb(255 255 255 / 8%);
  }

  .proto-bar__title {
    display: flex;
    flex: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .proto-bar__title::before {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: oklch(0.723 0.219 149.579);
    content: "";
  }

  .proto-bar__groups {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 18px;
  }

  .proto-group {
    display: flex;
    flex: none;
    align-items: center;
    gap: 4px;
    padding-left: 14px;
    border-left: 1px solid rgb(255 255 255 / 14%);
  }

  .proto-group:first-child {
    padding-left: 0;
    border-left: 0;
  }

  .proto-group__label {
    margin-right: 4px;
    color: rgb(255 255 255 / 45%);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .proto-chip {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 9px;
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: 6px;
    background: transparent;
    color: rgb(255 255 255 / 72%);
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .proto-chip:hover {
    border-color: rgb(255 255 255 / 32%);
    background: rgb(255 255 255 / 6%);
    color: #fff;
  }

  .proto-chip[aria-pressed="true"] {
    border-color: oklch(0.723 0.219 149.579);
    background: oklch(0.527 0.154 150.069);
    color: oklch(0.982 0.018 155.826);
  }

  .proto-link {
    margin-left: 4px;
    border-color: rgb(255 255 255 / 26%);
    color: rgb(255 255 255 / 88%);
  }

  .proto-bar__collapse {
    flex: none;
    height: 26px;
    margin-left: auto;
    padding: 0 9px;
    border: 1px solid rgb(255 255 255 / 14%);
    border-radius: 6px;
    background: transparent;
    color: rgb(255 255 255 / 55%);
    font-size: 11px;
    white-space: nowrap;
  }

  .proto-bar__collapse:hover {
    color: #fff;
    border-color: rgb(255 255 255 / 30%);
  }

  .proto-bar.is-collapsed .proto-bar__groups {
    display: none;
  }

  .proto-bar__note {
    flex: none;
    color: rgb(255 255 255 / 30%);
    font-size: 10px;
    white-space: nowrap;
  }

  .proto-bar.is-collapsed .proto-bar__note {
    display: none;
  }

  /* ------------------------------------------------------------------ 预览舞台 */
  .stage {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    background: oklch(var(--background));
  }

  .stage.is-device {
    display: grid;
    place-items: center;
    padding: 22px;
    background:
      radial-gradient(circle at 50% 0%, rgb(255 255 255 / 6%), transparent 55%),
      oklch(0.12 0.005 285.823);
  }

  .stage__frame {
    width: 100%;
    min-width: 0;
    min-height: 100%;
    container-name: page;
    container-type: inline-size;
  }

  .stage.is-device .stage__frame {
    width: 390px;
    height: 780px;
    min-height: 0;
    overflow: auto;
    border: 1px solid rgb(255 255 255 / 12%);
    border-radius: 28px;
    background: oklch(var(--background));
    box-shadow: 0 28px 80px rgb(0 0 0 / 45%);
  }

  /* ------------------------------------------------------------------ 页面：单列技术档案 */
  .page {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 100%;
    padding: 48px 24px;
    overflow: hidden;
    background: oklch(var(--background));
    isolation: isolate;
  }

  /* 细网格只作为背景刻度，不进入内容层。 */
  .page::before {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(to right, oklch(var(--foreground) / 4%) 1px, transparent 1px),
      linear-gradient(to bottom, oklch(var(--foreground) / 4%) 1px, transparent 1px);
    background-size: 48px 48px;
    content: "";
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 76%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 76%);
    opacity: 0.7;
  }

  .page-watermark {
    position: absolute;
    right: -24px;
    bottom: -74px;
    z-index: 0;
    color: transparent;
    font-size: 260px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.08em;
    opacity: 0.8;
    pointer-events: none;
    user-select: none;
    -webkit-text-stroke: 1px oklch(var(--foreground) / 7%);
  }

  .sheet {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding-left: 36px;
    border-left: 1px solid oklch(var(--border));
  }

  /* 绿色短线作为整张“档案页”的唯一高饱和色。 */
  .sheet::before {
    position: absolute;
    top: 0;
    left: -1px;
    width: 2px;
    height: 56px;
    background: oklch(var(--primary));
    content: "";
  }

  .sheet-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: oklch(var(--muted-foreground));
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    line-height: 16px;
    text-transform: uppercase;
  }

  .sheet-meta__right {
    color: oklch(var(--muted-foreground) / 72%);
    text-align: right;
  }

  .sheet-masthead {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 42px;
  }

  .brand-roundel {
    display: grid;
    flex: none;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 6px;
    border: 1px solid oklch(var(--border));
    border-radius: 999px;
    background: #fff;
  }

  .brand-roundel img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .brand-roundel + div {
    min-width: 0;
  }

  .masthead-name {
    margin: 0;
    color: oklch(var(--foreground));
    font-size: 20px;
    font-weight: 600;
    line-height: 28px;
    letter-spacing: 0;
  }

  .masthead-sub {
    margin: 2px 0 0;
    color: oklch(var(--muted-foreground));
    font-size: 12px;
    line-height: 18px;
  }

  .auth-form {
    width: 100%;
    max-width: 420px;
    margin-top: 48px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: oklch(var(--primary));
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    line-height: 16px;
    text-transform: uppercase;
  }

  .eyebrow::before {
    width: 6px;
    height: 6px;
    background: oklch(var(--primary));
    content: "";
  }

  .auth-heading {
    margin: 12px 0 0;
    color: oklch(var(--foreground));
    font-size: 32px;
    font-weight: 600;
    line-height: 42px;
    letter-spacing: -0.02em;
  }

  .auth-sub {
    margin: 8px 0 32px;
    color: oklch(var(--muted-foreground));
    font-size: 13px;
    line-height: 20px;
  }

  .alert {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    gap: 10px;
    margin: 0 0 24px;
    padding: 10px 0 10px 12px;
    border-left: 2px solid oklch(var(--destructive));
    background: oklch(var(--destructive) / 4%);
    color: oklch(var(--foreground));
    font-size: 13px;
    line-height: 18px;
  }

  .alert__icon {
    width: 16px;
    height: 16px;
    margin-top: 1px;
    color: oklch(var(--destructive));
  }

  .alert__message {
    margin: 0;
  }

  .alert__action {
    margin-top: 5px;
    padding: 0;
    border: 0;
    background: transparent;
    color: oklch(var(--destructive));
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .alert__action:hover {
    text-decoration-thickness: 2px;
  }

  .alert__action:disabled {
    opacity: 0.55;
  }

  .field + .field {
    margin-top: 20px;
  }

  .field-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field-index {
    color: oklch(var(--muted-foreground) / 70%);
    font-family: var(--font-mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    line-height: 16px;
  }

  .field label {
    color: oklch(var(--foreground));
    font-size: 13px;
    font-weight: 500;
    line-height: 20px;
  }

  .required-mark {
    color: oklch(var(--destructive));
    font-weight: 500;
  }

  .line-input {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 48px;
    padding: 0 2px;
    border-bottom: 1px solid oklch(var(--input));
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }

  .line-input:hover {
    border-bottom-color: oklch(var(--ring) / 70%);
  }

  .line-input:focus-within {
    border-bottom-color: oklch(var(--foreground));
    box-shadow: 0 1px 0 oklch(var(--foreground));
  }

  .line-input.is-invalid {
    border-bottom-color: oklch(var(--destructive));
    box-shadow: 0 1px 0 oklch(var(--destructive));
  }

  .line-input.is-disabled {
    opacity: 0.55;
  }

  .input-icon {
    flex: none;
    width: 15px;
    height: 15px;
    color: oklch(var(--muted-foreground));
  }

  .line-input input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: oklch(var(--foreground));
    font-size: 14px;
    line-height: 20px;
  }

  .line-input input::placeholder {
    color: oklch(var(--muted-foreground) / 70%);
  }

  .line-input input:-webkit-autofill {
    -webkit-text-fill-color: oklch(var(--foreground));
    box-shadow: 0 0 0 1000px oklch(var(--background)) inset;
  }

  .eye-button {
    display: inline-grid;
    flex: none;
    place-items: center;
    width: 32px;
    height: 32px;
    margin-right: -6px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: oklch(var(--muted-foreground));
    transition: background 120ms ease, color 120ms ease;
  }

  .eye-button:hover {
    background: oklch(var(--muted) / 70%);
    color: oklch(var(--foreground));
  }

  .eye-button svg {
    width: 17px;
    height: 17px;
  }

  .field-error {
    min-height: 18px;
    margin: 0;
    padding: 3px 0 0;
    color: oklch(var(--destructive));
    font-size: 12px;
    line-height: 16px;
  }

  .success-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 20px 0 0;
    padding: 10px 0 10px 12px;
    border-left: 2px solid oklch(var(--primary));
    background: oklch(var(--primary) / 5%);
    color: oklch(var(--foreground));
    font-size: 13px;
    line-height: 18px;
  }

  .success-note svg {
    flex: none;
    width: 16px;
    height: 16px;
    color: oklch(var(--primary));
  }

  .submit-button {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    margin-top: 20px;
    padding: 0 48px;
    border: 0;
    border-radius: var(--radius-control);
    background: oklch(var(--foreground));
    color: oklch(var(--background));
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    transition: background 150ms ease, color 150ms ease, opacity 150ms ease, transform 80ms ease;
  }

  .submit-button:hover:not(:disabled) {
    background: oklch(var(--primary));
    color: oklch(var(--primary-foreground));
  }

  .submit-button:active:not(:disabled) {
    background: color-mix(in oklch, oklch(var(--primary)), black 14%);
    transform: translateY(1px);
  }

  .submit-button:disabled {
    opacity: 0.55;
  }

  .submit-button:focus-visible {
    outline: 2px solid oklch(var(--primary));
    outline-offset: 3px;
  }

  .submit-arrow {
    position: absolute;
    right: 16px;
    width: 16px;
    height: 16px;
    transition: transform 150ms ease;
  }

  .submit-button:hover:not(:disabled) .submit-arrow {
    transform: translateX(2px);
  }

  .submit-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid currentcolor;
    border-right-color: transparent;
    border-radius: 999px;
    opacity: 0.8;
    animation: spin 720ms linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .sheet-footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid oklch(var(--border));
    color: oklch(var(--muted-foreground));
    font-size: 11px;
    line-height: 17px;
  }

  .sheet-footer p {
    margin: 0;
  }

  .sheet-footer p + p {
    margin-top: 4px;
    color: oklch(var(--muted-foreground) / 72%);
  }

  /* ------------------------------------------------------------------ 窄屏 */
  @container page (max-width: 640px) {
    .page {
      place-items: start center;
      padding: 28px 20px 32px;
    }

    .page-watermark {
      display: none;
    }

    .sheet {
      max-width: none;
      padding-left: 0;
      border-left: 0;
    }

    .sheet::before {
      left: 0;
      width: 40px;
      height: 2px;
    }

    .sheet-meta {
      padding-top: 16px;
      font-size: 9px;
      line-height: 14px;
    }

    .sheet-masthead {
      margin-top: 30px;
    }

    .brand-roundel {
      width: 44px;
      height: 44px;
      padding: 5px;
    }

    .masthead-name {
      font-size: 18px;
      line-height: 26px;
    }

    .auth-form {
      max-width: none;
      margin-top: 38px;
    }

    .auth-heading {
      font-size: 28px;
      line-height: 36px;
    }

    .line-input input {
      font-size: 16px;
      line-height: 24px;
    }

    .sheet-footer {
      margin-top: 40px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="proto-bar" id="protoBar">
    <div class="proto-bar__title">登录页重做 · 居中档案版</div>
    <div class="proto-bar__groups">
      <div class="proto-group" role="group" aria-label="主题">
        <span class="proto-group__label">主题</span>
        <button class="proto-chip" type="button" data-theme="light" aria-pressed="true">亮色</button>
        <button class="proto-chip" type="button" data-theme="dark" aria-pressed="false">暗色</button>
      </div>
      <div class="proto-group" role="group" aria-label="交互状态">
        <span class="proto-group__label">状态</span>
        <button class="proto-chip" type="button" data-demo="normal" aria-pressed="true">正常</button>
        <button class="proto-chip" type="button" data-demo="invalid" aria-pressed="false">校验</button>
        <button class="proto-chip" type="button" data-demo="credential" aria-pressed="false">凭证错误</button>
        <button class="proto-chip" type="button" data-demo="unavailable" aria-pressed="false">服务不可用</button>
        <button class="proto-chip" type="button" data-demo="loading" aria-pressed="false">提交中</button>
      </div>
      <div class="proto-group" role="group" aria-label="预览视口">
        <span class="proto-group__label">视口</span>
        <button class="proto-chip" type="button" data-viewport="desktop" aria-pressed="true">桌面</button>
        <button class="proto-chip" type="button" data-viewport="device" aria-pressed="false">390</button>
      </div>
      <a class="proto-chip proto-link" href="./prototype.html">返回分栏版</a>
      <span class="proto-bar__note">原型控制不属于页面设计</span>
    </div>
    <button class="proto-bar__collapse" type="button" id="collapseProtoBar">收起</button>
  </div>

  <div class="stage" id="stage">
    <div class="stage__frame">
      <div class="page" id="loginPage">
        <span class="page-watermark" aria-hidden="true">千树</span>

        <main class="sheet">
          <div class="sheet-meta">
            <span>QIANSHU DMS</span>
            <span class="sheet-meta__right">SECURE ACCESS</span>
          </div>

          <div class="sheet-masthead">
            <div class="brand-roundel">
              <img src="../../web/apps/qsmds-arco/src/assets/images/logo.svg" alt="千树数据管理系统 Logo">
            </div>
            <div>
              <p class="masthead-name">千树数据管理系统</p>
              <p class="masthead-sub">业务数据工作台</p>
            </div>
          </div>

          <section class="auth-form" aria-labelledby="loginTitle">
            <div class="eyebrow">Sign in</div>
            <h1 class="auth-heading" id="loginTitle">登录工作台</h1>
            <p class="auth-sub">使用管理员分配的账号继续</p>

            <div class="alert" id="globalAlert" role="alert" hidden>
              <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
              </svg>
              <div>
                <p class="alert__message" id="globalAlertMessage"></p>
                <button class="alert__action" type="button" id="checkLoginState" hidden>检查登录状态</button>
              </div>
            </div>

            <form id="loginForm" novalidate aria-busy="false">
              <div class="field" id="usernameField">
                <div class="field-head">
                  <span class="field-index" aria-hidden="true">01</span>
                  <label for="username">账号 <span class="required-mark" aria-hidden="true">*</span></label>
                </div>
                <div class="line-input" id="usernameShell">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="请输入账号"
                    autocomplete="username"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="next"
                    required
                    aria-required="true"
                    aria-describedby="usernameError"
                  >
                </div>
                <p class="field-error" id="usernameError" aria-live="polite"></p>
              </div>

              <div class="field" id="passwordField">
                <div class="field-head">
                  <span class="field-index" aria-hidden="true">02</span>
                  <label for="password">密码 <span class="required-mark" aria-hidden="true">*</span></label>
                </div>
                <div class="line-input" id="passwordShell">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="请输入登录密码"
                    maxlength="20"
                    autocomplete="current-password"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="go"
                    required
                    aria-required="true"
                    aria-describedby="passwordError"
                  >
                  <button class="eye-button" type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false" title="显示密码">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
                <p class="field-error" id="passwordError" aria-live="polite"></p>
              </div>

              <div class="success-note" id="successNote" role="status" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                <span>登录成功，正在进入工作台…</span>
              </div>

              <button class="submit-button" type="submit" id="submitButton">
                <span class="submit-spinner" id="submitSpinner" hidden aria-hidden="true"></span>
                <span id="submitLabel">登录系统</span>
                <svg class="submit-arrow" id="submitArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </button>
            </form>
          </section>

          <footer class="sheet-footer">
            <p>内部业务数据工作台 · v0.8.4版</p>
            <p>Copyright © 2023–2026 Liaocheng Qianshu Culture Media Co., Ltd. All Rights Reserved.</p>
          </footer>
        </main>
      </div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const protoBar = document.getElementById('protoBar');
  const stage = document.getElementById('stage');
  const form = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const usernameField = document.getElementById('usernameField');
  const passwordField = document.getElementById('passwordField');
  const usernameShell = document.getElementById('usernameShell');
  const passwordShell = document.getElementById('passwordShell');
  const usernameError = document.getElementById('usernameError');
  const passwordError = document.getElementById('passwordError');
  const globalAlert = document.getElementById('globalAlert');
  const globalAlertMessage = document.getElementById('globalAlertMessage');
  const checkLoginState = document.getElementById('checkLoginState');
  const successNote = document.getElementById('successNote');
  const submitButton = document.getElementById('submitButton');
  const submitSpinner = document.getElementById('submitSpinner');
  const submitLabel = document.getElementById('submitLabel');
  const submitArrow = document.getElementById('submitArrow');
  const togglePassword = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  const state = {
    demo: 'normal',
    loading: false,
    theme: 'light',
    touched: {
      password: false,
      username: false,
    },
    viewport: 'desktop',
  };

  const icons = {
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle>',
    eyeOff: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path>',
  };

  function setPressed(attribute, activeValue) {
    document.querySelectorAll(`[${attribute}]`).forEach((button) => {
      button.setAttribute('aria-pressed', String(button.getAttribute(attribute) === activeValue));
    });
  }

  function render() {
    root.classList.toggle('dark', state.theme === 'dark');
    stage.classList.toggle('is-device', state.viewport === 'device');
    setPressed('data-theme', state.theme);
    setPressed('data-demo', state.demo);
    setPressed('data-viewport', state.viewport);
  }

  function setLoading(loading) {
    state.loading = loading;
    submitButton.disabled = loading;
    usernameInput.disabled = loading;
    passwordInput.disabled = loading;
    togglePassword.disabled = loading;
    usernameShell.classList.toggle('is-disabled', loading);
    passwordShell.classList.toggle('is-disabled', loading);
    submitSpinner.hidden = !loading;
    submitArrow.hidden = loading;
    submitLabel.textContent = loading ? '登录中…' : '登录系统';
    form.setAttribute('aria-busy', String(loading));
  }

  function clearFieldError(name) {
    const field = name === 'username' ? usernameField : passwordField;
    const shell = name === 'username' ? usernameShell : passwordShell;
    const error = name === 'username' ? usernameError : passwordError;
    const input = name === 'username' ? usernameInput : passwordInput;
    field.classList.remove('has-error');
    shell.classList.remove('is-invalid');
    input.removeAttribute('aria-invalid');
    error.textContent = '';
  }

  function setFieldError(name, message) {
    const field = name === 'username' ? usernameField : passwordField;
    const shell = name === 'username' ? usernameShell : passwordShell;
    const error = name === 'username' ? usernameError : passwordError;
    const input = name === 'username' ? usernameInput : passwordInput;
    field.classList.toggle('has-error', Boolean(message));
    shell.classList.toggle('is-invalid', Boolean(message));
    input.setAttribute('aria-invalid', String(Boolean(message)));
    error.textContent = message;
  }

  function validateField(name) {
    const input = name === 'username' ? usernameInput : passwordInput;
    let message = '';
    if (input.value.length === 0) {
      message = name === 'username' ? '请输入账号' : '请输入密码';
    }
    setFieldError(name, message);
    return message === '';
  }

  function validateAll() {
    state.touched.username = true;
    state.touched.password = true;
    const usernameValid = validateField('username');
    const passwordValid = validateField('password');
    if (!usernameValid) {
      usernameInput.focus();
      return false;
    }
    if (!passwordValid) {
      passwordInput.focus();
      return false;
    }
    return true;
  }

  function clearAlert() {
    globalAlert.hidden = true;
    globalAlertMessage.textContent = '';
    checkLoginState.hidden = true;
  }

  function showAlert(message, withCheckAction) {
    globalAlertMessage.textContent = message;
    checkLoginState.hidden = !withCheckAction;
    checkLoginState.disabled = false;
    checkLoginState.textContent = '检查登录状态';
    globalAlert.hidden = false;
  }

  function clearSuccess() {
    successNote.hidden = true;
  }

  function syncPasswordToggle() {
    const visible = passwordInput.type === 'text';
    togglePassword.setAttribute('aria-pressed', String(visible));
    togglePassword.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
    togglePassword.title = visible ? '隐藏密码' : '显示密码';
    eyeIcon.innerHTML = visible ? icons.eyeOff : icons.eye;
  }

  function resetToNormal() {
    clearAlert();
    clearSuccess();
    clearFieldError('username');
    clearFieldError('password');
    setLoading(false);
    usernameInput.value = '';
    passwordInput.value = '';
    passwordInput.type = 'password';
    state.touched.username = false;
    state.touched.password = false;
    syncPasswordToggle();
  }

  function applyDemo(demo) {
    state.demo = demo;
    clearAlert();
    clearSuccess();
    clearFieldError('username');
    clearFieldError('password');
    setLoading(false);
    state.touched.username = false;
    state.touched.password = false;
    passwordInput.type = 'password';
    syncPasswordToggle();

    if (demo === 'normal') {
      usernameInput.value = '';
      passwordInput.value = '';
      syncPasswordToggle();
    }
    else if (demo === 'invalid') {
      usernameInput.value = '';
      passwordInput.value = '';
      syncPasswordToggle();
      state.touched.username = true;
      state.touched.password = true;
      validateField('username');
      validateField('password');
    }
    else if (demo === 'credential') {
      usernameInput.value = 'operator';
      passwordInput.value = '';
      syncPasswordToggle();
      showAlert('账号或密码错误', false);
      passwordInput.focus();
    }
    else if (demo === 'unavailable') {
      usernameInput.value = 'operator';
      passwordInput.value = '';
      syncPasswordToggle();
      showAlert('认证服务暂时不可用', true);
    }
    else if (demo === 'loading') {
      usernameInput.value = 'operator';
      passwordInput.value = 'Qianshu2026';
      syncPasswordToggle();
      setLoading(true);
    }

    render();
  }

  document.querySelectorAll('[data-theme]').forEach((button) => {
    button.addEventListener('click', () => {
      state.theme = button.dataset.theme;
      render();
    });
  });

  document.querySelectorAll('[data-viewport]').forEach((button) => {
    button.addEventListener('click', () => {
      state.viewport = button.dataset.viewport;
      render();
    });
  });

  document.querySelectorAll('[data-demo]').forEach((button) => {
    button.addEventListener('click', () => {
      applyDemo(button.dataset.demo);
    });
  });

  document.getElementById('collapseProtoBar').addEventListener('click', (event) => {
    const collapsed = protoBar.classList.toggle('is-collapsed');
    event.currentTarget.textContent = collapsed ? '展开' : '收起';
  });

  usernameInput.addEventListener('blur', () => {
    state.touched.username = true;
    validateField('username');
  });

  passwordInput.addEventListener('blur', () => {
    state.touched.password = true;
    validateField('password');
  });

  usernameInput.addEventListener('input', () => {
    clearAlert();
    clearSuccess();
    if (state.touched.username || usernameError.textContent) {
      validateField('username');
    }
  });

  passwordInput.addEventListener('input', () => {
    clearAlert();
    clearSuccess();
    if (passwordInput.value.length === 0 && passwordInput.type === 'text') {
      passwordInput.type = 'password';
    }
    syncPasswordToggle();
    if (state.touched.password || passwordError.textContent) {
      validateField('password');
    }
  });

  togglePassword.addEventListener('click', () => {
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    syncPasswordToggle();
    passwordInput.focus();
  });

  checkLoginState.addEventListener('click', () => {
    if (checkLoginState.disabled) {
      return;
    }
    checkLoginState.disabled = true;
    checkLoginState.textContent = '检查中…';
    window.setTimeout(() => {
      checkLoginState.disabled = false;
      checkLoginState.textContent = '检查登录状态';
      showAlert('当前仍未登录，可稍后再次检查或重新输入密码登录', true);
    }, 800);
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (state.loading) {
      return;
    }
    clearAlert();
    clearSuccess();

    if (!validateAll()) {
      return;
    }

    setLoading(true);
    const demo = state.demo;

    window.setTimeout(() => {
      setLoading(false);

      if (demo === 'credential') {
        passwordInput.value = '';
        passwordInput.type = 'password';
        syncPasswordToggle();
        showAlert('账号或密码错误', false);
        passwordInput.focus();
        return;
      }

      if (demo === 'unavailable') {
        passwordInput.value = '';
        passwordInput.type = 'password';
        syncPasswordToggle();
        showAlert('认证服务暂时不可用', true);
        return;
      }

      successNote.hidden = false;
      submitButton.disabled = true;
      window.setTimeout(() => {
        successNote.hidden = true;
        submitButton.disabled = false;
      }, 1800);
    }, 900);
  });

  syncPasswordToggle();
  render();
</script>
</body>
</html>
