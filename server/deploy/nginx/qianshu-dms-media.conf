# 本文件是 server {} 上下文内的部署片段；TLS、域名与通用 /api/ 代理由宿主配置负责。
# X-Accel-Redirect 只能进入 internal location，外部请求同一路径由 Nginx 拒绝。
location ^~ /_qianshu_internal_media/ {
    internal;
    alias /var/lib/qianshu-dms/media/;
    disable_symlinks on;
    max_ranges 1;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 500MiB VIDEO 加上有界 multipart framing；Server 仍负责精确文件字节上限与内容验证。
location ~ ^/api/products/[0-9a-f-]+/media$ {
    client_max_body_size 501m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}
