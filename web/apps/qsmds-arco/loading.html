<style>
@keyframes qianshu-loading-ring {
  to {
    transform: rotate(1turn);
  }
}

.qianshu-loading,
.qianshu-loading * {
  box-sizing: border-box;
}

.qianshu-loading {
  --loading-brand-green: #2fa127;
  --loading-brand-brown: #8e6439;
  --loading-canvas: #f4f6ef;
  --loading-surface: #e9eee5;
  --loading-ink: #182019;
  --loading-muted: #667066;
  --loading-guide: #d7ddd1;
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  min-width: 280px;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  overflow: hidden;
  color: var(--loading-ink);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  user-select: none;
  background: var(--loading-canvas);
}

/* 两条低对比引导线建立数据工作台的秩序感，同时避免首屏落入通用居中卡片样式。 */
.qianshu-loading::before {
  position: absolute;
  inset: clamp(24px, 5vw, 72px);
  pointer-events: none;
  content: "";
  border-top: 1px solid var(--loading-guide);
  border-left: 1px solid var(--loading-guide);
}

.qianshu-loading::after {
  position: absolute;
  right: clamp(24px, 5vw, 72px);
  bottom: clamp(24px, 5vw, 72px);
  width: 52px;
  height: 3px;
  pointer-events: none;
  content: "";
  background: var(--loading-brand-brown);
  border-left: 76px solid var(--loading-brand-green);
}

.qianshu-loading__stage {
  position: relative;
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 32px;
  align-items: center;
  width: min(560px, calc(100vw - 80px));
  transform: translateY(-4vh);
}

.qianshu-loading__logo-frame {
  position: relative;
  display: grid;
  width: 120px;
  height: 120px;
  place-items: center;
  background: var(--loading-surface);
  border: 1px solid var(--loading-guide);
  border-radius: 50%;
}

/* 年轮只承担“仍在初始化”的状态表达；Logo 本体保持静止，避免削弱品牌辨识度。 */
.qianshu-loading__ring {
  position: absolute;
  inset: -1px;
  border: 2px solid transparent;
  border-top-color: var(--loading-brand-green);
  border-right-color: var(--loading-brand-green);
  border-bottom-color: var(--loading-brand-brown);
  border-radius: 50%;
  animation: qianshu-loading-ring 1.7s linear infinite;
}

.qianshu-loading__logo {
  position: relative;
  display: block;
  width: 92px;
  height: 92px;
  object-fit: contain;
}

.qianshu-loading__copy {
  min-width: 0;
}

.qianshu-loading__brand {
  margin: 0 0 8px;
  color: var(--loading-brand-brown);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.16em;
}

.qianshu-loading__title {
  margin: 0;
  overflow: hidden;
  font-size: clamp(26px, 3vw, 32px);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.qianshu-loading__divider {
  width: 100%;
  height: 1px;
  margin: 18px 0 13px;
  background: var(--loading-guide);
}

.qianshu-loading__status {
  display: flex;
  gap: 9px;
  align-items: center;
  color: var(--loading-muted);
  font-size: 14px;
  line-height: 1.6;
}

.qianshu-loading__status-dot {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  background: var(--loading-brand-green);
  border-radius: 50%;
}

.qianshu-loading__scope {
  margin-left: auto;
  font-size: 12px;
}

html.dark .qianshu-loading,
html[color-scheme="dark"] .qianshu-loading {
  --loading-canvas: #151a16;
  --loading-surface: #edf1e8;
  --loading-ink: #eef3ea;
  --loading-muted: #a7b0a6;
  --loading-guide: #323b33;
}

@media (max-width: 560px) {
  .qianshu-loading::before {
    inset: 24px;
  }

  .qianshu-loading::after {
    right: 24px;
    bottom: 24px;
  }

  .qianshu-loading__stage {
    grid-template-columns: 1fr;
    gap: 24px;
    justify-items: center;
    width: min(320px, calc(100vw - 64px));
    text-align: center;
    transform: translateY(-2vh);
  }

  .qianshu-loading__logo-frame {
    width: 104px;
    height: 104px;
  }

  .qianshu-loading__logo {
    width: 78px;
    height: 78px;
  }

  .qianshu-loading__copy {
    width: 100%;
  }

  .qianshu-loading__status {
    flex-wrap: wrap;
    justify-content: center;
  }

  .qianshu-loading__scope {
    flex-basis: 100%;
    margin-left: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  /* 插件依赖 transitionend 清理外层节点，因此保留 1ms 而不是直接关闭 transition。 */
  [data-app-loading] {
    transition-duration: 1ms !important;
  }

  .qianshu-loading__ring {
    animation: none;
    transform: rotate(18deg);
  }
}
</style>

<div
  class="qianshu-loading"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <div class="qianshu-loading__stage">
    <div class="qianshu-loading__logo-frame" aria-hidden="true">
      <span class="qianshu-loading__ring"></span>
      <img
        class="qianshu-loading__logo"
        src="/src/assets/images/logo.svg"
        alt=""
      />
    </div>

    <div class="qianshu-loading__copy">
      <p class="qianshu-loading__brand">千树 DMS</p>
      <p class="qianshu-loading__title">%VITE_APP_TITLE%</p>
      <div class="qianshu-loading__divider" aria-hidden="true"></div>
      <div class="qianshu-loading__status">
        <span class="qianshu-loading__status-dot" aria-hidden="true"></span>
        <span>正在准备工作台</span>
        <span class="qianshu-loading__scope">面向业务管理场景</span>
      </div>
    </div>
  </div>
</div>
