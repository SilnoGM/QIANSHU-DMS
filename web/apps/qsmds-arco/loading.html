<style>
@keyframes qianshu-loading-stripes {
  from {
    transform: translate3d(-6vw, 0, 0);
  }

  to {
    transform: translate3d(6vw, 0, 0);
  }
}

@keyframes qianshu-loading-progress {
  from {
    transform: translate3d(-130%, 0, 0);
  }

  to {
    transform: translate3d(350%, 0, 0);
  }
}

/* 只提供首屏可见时长基准，不产生位移、闪烁或颜色变化。 */
@keyframes qianshu-loading-minimum-duration {
  from,
  to {
    opacity: 1;
  }
}

.qianshu-loading,
.qianshu-loading * {
  box-sizing: border-box;
}

.qianshu-loading {
  --loading-primary: __QIANSHU_LOADING_PRIMARY__;
  --loading-foreground: __QIANSHU_LOADING_FOREGROUND__;
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  overflow: hidden;
  color: oklch(var(--loading-foreground));
  /* Loading 早于 globals.css 生效，因此在此复制产品 Sans 与原生 Emoji 的固定顺序。 */
  font-family: "Noto Sans SC", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  text-align: center;
  user-select: none;
  background: linear-gradient(
    100deg,
    #f0f6fe 0%,
    #ecf5ff 30%,
    #f4f7f7 62%,
    #fefae9 100%
  );
  animation: qianshu-loading-minimum-duration 1.5s linear;
  animation-fill-mode: none;
  isolation: isolate;
}

/* 斜线只借用当前浅色主题主色，并以极低透明度提供持续但不喧宾夺主的方向感。 */
.qianshu-loading__stripes {
  position: absolute;
  inset: -25%;
  z-index: 0;
  pointer-events: none;
  background-image: repeating-linear-gradient(
    113deg,
    transparent 0,
    transparent 127px,
    oklch(var(--loading-primary) / 4.5%) 128px,
    oklch(var(--loading-primary) / 4.5%) 129px,
    transparent 130px,
    transparent 256px
  );
  animation: qianshu-loading-stripes 8s linear infinite alternate;
  will-change: transform;
}

.qianshu-loading__stage {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(360px, calc(100vw - 48px));
  transform: translateY(-3vh);
}

.qianshu-loading__logo {
  display: block;
  width: 108px;
  height: 108px;
  object-fit: contain;
  filter: drop-shadow(0 12px 20px oklch(var(--loading-primary) / 10%));
}

.qianshu-loading__heading {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  margin-top: 20px;
}

.qianshu-loading__title {
  min-width: 0;
  margin: 0;
  overflow: hidden;
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.qianshu-loading__version {
  flex: 0 0 auto;
  padding: 3px 8px;
  color: oklch(var(--loading-primary));
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 0.02em;
  background: oklch(var(--loading-primary) / 8%);
  border: 1px solid oklch(var(--loading-primary) / 14%);
  border-radius: 999px;
}

.qianshu-loading__progress {
  width: min(320px, 100%);
  height: 4px;
  margin-top: 28px;
  overflow: hidden;
  background: oklch(var(--loading-primary) / 10%);
  border-radius: 999px;
}

/* 进度段表达“仍在向前初始化”，不展示无法由真实加载状态支撑的百分比。 */
.qianshu-loading__progress-value {
  display: block;
  width: 40%;
  height: 100%;
  background: oklch(var(--loading-primary));
  border-radius: inherit;
  box-shadow: 0 0 12px oklch(var(--loading-primary) / 24%);
  animation: qianshu-loading-progress 1.45s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  will-change: transform;
}

.qianshu-loading__status {
  margin: 12px 0 0;
  color: oklch(var(--loading-foreground) / 62%);
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: 0.04em;
}

.qianshu-loading__copyright {
  position: absolute;
  right: max(24px, env(safe-area-inset-right));
  bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
  left: max(24px, env(safe-area-inset-left));
  z-index: 1;
  margin: 0;
  color: oklch(var(--loading-foreground) / 62%);
  font-size: 12px;
  line-height: 1.6;
}

@media (max-width: 560px) {
  .qianshu-loading__stage {
    width: min(280px, calc(100vw - 48px));
    transform: translateY(-2vh);
  }

  .qianshu-loading__logo {
    width: 84px;
    height: 84px;
  }

  .qianshu-loading__heading {
    gap: 7px;
    margin-top: 18px;
  }

  .qianshu-loading__title {
    font-size: 21px;
    line-height: 1.35;
  }

  .qianshu-loading__version {
    padding: 2px 7px;
  }

  .qianshu-loading__progress {
    width: min(240px, 100%);
    margin-top: 24px;
  }

  .qianshu-loading__copyright {
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, calc(env(safe-area-inset-bottom) + 12px));
    left: max(16px, env(safe-area-inset-left));
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  /* 插件依赖 transitionend 清理外层节点，因此保留 1ms 而不是直接关闭 transition。 */
  [data-app-loading] {
    transition-duration: 1ms !important;
  }

  .qianshu-loading__stripes,
  .qianshu-loading__progress-value {
    animation: none;
  }

  .qianshu-loading__stripes {
    transform: none;
  }

  .qianshu-loading__progress-value {
    width: 42%;
    transform: none;
  }
}
</style>

<div
  class="qianshu-loading"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <div class="qianshu-loading__stripes" aria-hidden="true"></div>

  <div class="qianshu-loading__stage">
    <img
      class="qianshu-loading__logo"
      src="/src/assets/images/logo.svg"
      alt=""
    />

    <div class="qianshu-loading__heading">
      <p class="qianshu-loading__title">%VITE_APP_TITLE%</p>
      <span class="qianshu-loading__version">v__QIANSHU_APP_VERSION__</span>
    </div>

    <div class="qianshu-loading__progress" aria-hidden="true">
      <span class="qianshu-loading__progress-value"></span>
    </div>
    <p class="qianshu-loading__status">正在准备工作台</p>
  </div>

  <p class="qianshu-loading__copyright">
    © 2023–2026 Liaocheng Qianshu Culture Media Co., Ltd. All Rights Reserved.
  </p>
</div>
