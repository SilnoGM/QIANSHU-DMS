# 千树 DMS Web 站点配置（容器内 /etc/nginx/conf.d/qianshu-dms.conf）。
# TLS 证书由 compose 只读挂载到 /etc/nginx/certs/：fullchain.pem 与 privkey.pem。
# 站点是该部署形态的唯一入口：静态产物、/api 反向代理都在这里；Server 与 db 不发布宿主端口。

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Ubuntu 24.04 自带 nginx 1.24 仍需把 http2 写在 listen 上；升级到 1.25+ 后应改为 http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    # 本地构建可能在 dist 内附带预压缩文件；CI 产出的归档没有，缺失时自动回退到原文件。
    gzip_static on;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 默认 hash 路由（routeMode=hash）不需要 SPA fallback；若切换 history 路由，需在此追加
    # try_files $uri $uri/ /index.html; 并重新验收深链接。
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Server 容器可能被单独重建并更换 IP，必须使用 Docker 内置 DNS 在运行期解析，
        # 否则 nginx 会缓存启动时的地址，更新后出现 502。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $qianshu_server "http://server:3000";

        # 媒体单文件上限 500 MiB，加上有界 multipart framing；精确字节上限、内容类型与
        # 权限校验仍由 Server 负责。请求不落盘缓冲，避免容器内为 500 MiB 上传写临时文件。
        client_max_body_size 501m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $qianshu_server;
    }
}
