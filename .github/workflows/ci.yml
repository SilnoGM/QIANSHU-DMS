name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: qianshu-ci-${{ inputs.release_tag != '' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  root-governance:
    name: Root governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run root governance tests
        run: node --run test:root

      - name: Verify root dependency boundary
        run: |
          test ! -e pnpm-workspace.yaml
          test ! -e pnpm-lock.yaml
          test ! -e node_modules

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  server-check-build:
    name: Server check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install Server dependencies
        run: pnpm -C server install --frozen-lockfile

      - name: Check Server
        run: pnpm -C server check

      - name: Build Server
        run: pnpm -C server build

      - name: Verify Server entrypoint
        run: test -f server/dist/main.js && test ! -L server/dist/main.js && test -s server/dist/main.js

      - name: Package Server release archive
        if: inputs.release_tag == ''
        run: |
          package_tag="v$(node -p 'require("./package.json").version')"
          output="$RUNNER_TEMP/release-server-ci"
          node --run release:package:server -- \
            --tag "$package_tag" \
            --output "$output"
          archive="$output/qsmds-server-${package_tag}-linux-x64.tar.gz"
          test -f "$archive"
          test ! -L "$archive"
          test -s "$archive"

      - name: Smoke test Server release archive
        if: inputs.release_tag == ''
        run: |
          package_tag="v$(node -p 'require("./package.json").version')"
          archive="$RUNNER_TEMP/release-server-ci/qsmds-server-${package_tag}-linux-x64.tar.gz"
          node --run release:smoke:server -- \
            --tag "$package_tag" \
            --archive "$archive"

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  server-e2e:
    name: Server E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install Server dependencies
        run: pnpm -C server install --frozen-lockfile

      - name: Run isolated Server E2E
        run: node --run ci:server-e2e

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  contract:
    name: Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTENV_CONFIG_PATH: /dev/null
      QIANSHU_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install Server dependencies
        run: pnpm -C server install --frozen-lockfile

      - name: Install Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Check API contract
        run: node --run ci:contract

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  web-check-build:
    name: Web check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Generate Web API types
        run: pnpm -C web api:generate

      - name: Check Web
        run: pnpm -C web check

      - name: Build Web
        run: pnpm -C web build

      - name: Verify Web entrypoint
        run: test -f web/apps/qsmds-arco/dist/index.html && test ! -L web/apps/qsmds-arco/dist/index.html && test -s web/apps/qsmds-arco/dist/index.html

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  browser-auth-e2e:
    name: Browser auth E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # Browser auth E2E 会启动真实 Server；即使认证场景不上传视频，媒体配置仍必须指向真实 ffprobe。
      - name: Install FFmpeg dependency
        run: |
          if test ! -x /usr/bin/ffprobe; then
            # GitHub Runner 的 mirror+file 会优先选择 Azure 镜像；该镜像异常时可能持续阻塞到 Job 超时。
            # 这里使用隔离索引和 Ubuntu 官方 HTTPS 源，避免旧索引、第三方源或云镜像参与解析。
            sudo tee /etc/apt/sources.list.d/qianshu-ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            apt_lists="${RUNNER_TEMP}/qianshu-apt-lists"
            mkdir -p "${apt_lists}/partial"
            apt_options=(
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/qianshu-ubuntu.sources
              -o Dir::Etc::sourceparts=-
              -o "Dir::State::lists=${apt_lists}"
              -o Acquire::Retries=3
              -o Acquire::https::Timeout=30
            )
            sudo timeout 5m apt-get "${apt_options[@]}" update
            sudo timeout 15m apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          fi
          test -x /usr/bin/ffprobe
          /usr/bin/ffprobe -version

      - name: Install Server dependencies
        run: pnpm -C server install --frozen-lockfile

      - name: Install Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Run isolated browser authentication E2E
        run: node --run ci:browser-auth-e2e

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  browser-dictionaries-e2e:
    name: Browser dictionaries E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install Server dependencies
        run: pnpm -C server install --frozen-lockfile

      - name: Install Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Run isolated browser dictionaries E2E
        run: node --run ci:browser-dictionaries-e2e

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .

  ci-gate:
    name: CI gate
    needs: [root-governance, server-check-build, server-e2e, contract, web-check-build, browser-auth-e2e, browser-dictionaries-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation Job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node -e "const needs=JSON.parse(process.env.NEEDS_JSON);const results=Object.values(needs).map(entry=>entry.result);if(results.length!==7||results.some(result=>result!=='success'))process.exit(1)"
