name: Examples

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 1 * *'

permissions:
  contents: read

jobs:
  examples-check-build:
    name: Examples check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Check reference applications
        run: pnpm -C web check:examples

      - name: Build reference applications
        run: pnpm -C web build:examples

      - name: Verify tracked files are unchanged
        run: git diff --exit-code -- .
